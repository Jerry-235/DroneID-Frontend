<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DroneID — Live Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:            #0F1720;
    --panel:         #16212C;
    --panel-raised:  #1C2A38;
    --hairline:      #263544;
    --text:          #E6EDF3;
    --text-muted:    #7C8B99;
    --amber:         #E8A33D;   /* live drone / primary accent */
    --amber-dim:     #7A5A28;
    --cyan:          #4FD1C5;   /* operator position / history playback */
    --red:           #E0645A;   /* dropped/error */
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .topbar{
    height:48px;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:16px;
    padding:0 16px;
    border-bottom:1px solid var(--hairline);
    background:var(--panel);
  }
  .brand{ font-weight:700; font-size:14px; letter-spacing:0.02em; }
  .brand span{color:var(--amber);}
  .tabs{ display:flex; gap:2px; background:var(--bg); border-radius:var(--radius); padding:2px; }
  .tab-btn{
    background:transparent; border:none; color:var(--text-muted);
    font-family:'Inter',sans-serif; font-size:12px; font-weight:600;
    padding:5px 12px; border-radius:2px; cursor:pointer; letter-spacing:0.03em;
  }
  .tab-btn.active{ background:var(--panel-raised); color:var(--amber); }
  .status{
    display:flex; align-items:center; gap:8px;
    font-size:12px; color:var(--text-muted); font-family:'IBM Plex Mono',monospace;
  }
  .dot{
    width:8px;height:8px;border-radius:50%; background:var(--red);
    box-shadow:0 0 0 3px rgba(224,100,90,0.15); transition:background .2s, box-shadow .2s;
  }
  .dot.connected{ background:var(--cyan); box-shadow:0 0 0 3px rgba(79,209,197,0.15); }
  .dot.health-ok{ background:#34D399; box-shadow:0 0 0 3px rgba(52,211,153,0.15); }
  .dot.health-yellow{ background:var(--amber); box-shadow:0 0 0 3px rgba(232,163,61,0.15); }
  .health-group{
    display:flex; align-items:center; gap:12px;
    font-size:11px; font-family:'IBM Plex Mono',monospace; color:var(--text-muted);
  }
  .health-item{ display:flex; align-items:center; gap:6px; }
  @media (max-width: 640px){ .health-group{ display:none; } }
  .count{ margin-left:auto; font-size:12px; color:var(--text-muted); font-family:'IBM Plex Mono',monospace; }
  .count b{color:var(--text);font-weight:600;}
  .main{ flex:1 1 auto; display:flex; min-height:0; }
  .sidebar{
    width:300px; flex:0 0 auto; background:var(--panel);
    border-right:1px solid var(--hairline); overflow-y:auto;
    transition: width 0.2s ease;
  }
  .sidebar.collapsed{ width:0; border-right:none; overflow:hidden; }
  .sidebar-empty{ padding:24px 16px; color:var(--text-muted); font-size:13px; line-height:1.5; }
  .track-row{
    padding:10px 14px; border-bottom:1px solid var(--hairline); cursor:pointer;
    display:flex; flex-direction:column; gap:3px;
  }
  .track-row:hover{background:var(--panel-raised);}
  .track-row.selected{background:var(--panel-raised);border-left:2px solid var(--amber);padding-left:12px;}
  .track-row .row-top{ display:flex; align-items:center; gap:8px; }
  .status-chip{ width:7px;height:7px;border-radius:50%;flex:0 0 auto; }
  .status-chip.live{background:var(--amber);}
  .status-chip.stale{background:var(--text-muted);}
  .track-name{
    font-size:13px; font-weight:600; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; flex:1 1 auto;
  }
  .track-sub{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-muted);
    display:flex; gap:10px; flex-wrap:wrap;
  }
  .track-op-row{
    margin-top:8px; padding-top:7px; border-top:1px solid var(--hairline);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .track-op-indicator{
    display:flex; align-items:center; gap:5px;
    font-size:10px; font-family:'IBM Plex Mono',monospace; color:var(--text-muted);
  }
  .track-op-indicator.op-yes{ color:#34D399; }
  .op-dot{
    width:6px; height:6px; border-radius:50%; background:var(--text-muted);
    flex:0 0 auto;
  }
  .op-dot.op-yes{
    background:#34D399; box-shadow:0 0 6px #34D399;
    animation:op-pulse 1.6s ease-in-out infinite;
  }
  @keyframes op-pulse{ 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  .focus-op-btn{
    background:rgba(52,211,153,0.1); color:#34D399; border:1px solid rgba(52,211,153,0.35);
    font-size:10px; font-weight:600; padding:3px 8px; border-radius:var(--radius); cursor:pointer;
    font-family:'Inter',sans-serif; flex:0 0 auto;
  }
  .focus-op-btn:hover{ background:rgba(52,211,153,0.2); }
  .track-date{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-muted); }
  .pencil-btn{
    background:none; border:none; color:var(--text-muted); cursor:pointer;
    padding:2px 4px; font-size:12px; flex:0 0 auto; opacity:0.6;
  }
  .pencil-btn:hover{opacity:1;color:var(--amber);}

  .settings-group-title{
    padding:12px 14px 4px; font-size:11px; font-weight:700; letter-spacing:0.05em;
    color:var(--amber); text-transform:uppercase; border-top:1px solid var(--hairline);
  }
  .settings-group-title:first-child{border-top:none;margin-top:0;}
  .settings-row{
    display:flex; align-items:center; gap:8px; padding:5px 14px; cursor:pointer; font-size:12px;
  }
  .settings-row:hover{background:var(--panel-raised);}
  .settings-row input{accent-color:var(--amber);width:14px;height:14px;flex:0 0 auto;}
  .settings-note{ padding:12px 14px; font-size:11px; color:var(--text-muted); line-height:1.5; }
  .station-form{ padding:0 14px 14px; display:flex; flex-direction:column; gap:8px; }
  .station-form input{
    background:var(--bg); border:1px solid var(--hairline); color:var(--text);
    font-family:'IBM Plex Mono',monospace; font-size:12px; padding:6px 8px; border-radius:var(--radius);
    width:100%;
  }
  .station-form input:focus{ outline:none; border-color:var(--amber); }
  .station-form-buttons{ display:flex; gap:8px; }
  .settings-btn{
    flex:1 1 auto; background:var(--amber); color:#0B121A; border:none;
    font-family:'Inter',sans-serif; font-size:12px; font-weight:600;
    padding:7px 10px; border-radius:var(--radius); cursor:pointer;
  }
  .settings-btn:hover{ opacity:0.9; }
  .settings-btn-ghost{
    background:transparent; color:var(--text-muted); border:1px solid var(--hairline);
  }
  .settings-btn-ghost:hover{ color:var(--text); border-color:var(--text-muted); }
  .popup-group-title{
    font-size:10px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--amber); margin:8px 0 4px; opacity:0.85;
  }
  .popup-group-title:first-of-type{margin-top:2px;}

  .map-wrap{ flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }
  #map{flex:1 1 auto;background:#DDE3E8;}

  .scrubber-bar{
    display:none; flex:0 0 auto; height:60px; background:var(--panel);
    border-top:1px solid var(--hairline); padding:0 16px; align-items:center; gap:14px;
  }
  .scrubber-bar.show{display:flex;}
  .scrub-btn{
    background:var(--panel-raised); border:1px solid var(--hairline); color:var(--amber);
    width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:12px;flex:0 0 auto;
  }
  .scrub-range{flex:1 1 auto;accent-color:var(--amber);}
  .scrub-readout{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-muted);
    display:flex; gap:14px; white-space:nowrap;
  }
  .scrub-readout b{color:var(--text);font-weight:500;}

  /* Leaflet overrides for dark UI on a full-color basemap */
  .leaflet-container{background:#DDE3E8;}
  .leaflet-control-layers{
    background:var(--panel-raised); color:var(--text); border:1px solid var(--hairline);
    border-radius:var(--radius); box-shadow:none;
  }
  .leaflet-control-layers-toggle{ filter:invert(1) brightness(1.6); }
  .leaflet-control-layers-expanded{ padding:8px 10px; font-family:'Inter',sans-serif; font-size:12px; }
  .leaflet-control-layers label{ margin-bottom:4px; }
  .leaflet-bar a{
    background:var(--panel-raised); color:var(--text); border-color:var(--hairline);
  }
  .leaflet-bar a:hover{ background:var(--panel); }
  .leaflet-popup-content-wrapper{
    background:var(--panel-raised); color:var(--text);
    border-radius:var(--radius); border:1px solid var(--hairline);
  }
  .leaflet-popup-tip{background:var(--panel-raised);}
  .popup-badge-row{ margin-bottom:6px; }
  .popup-badge{
    display:inline-block; padding:2px 7px; border-radius:3px; border:1px solid;
    font-size:10px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase;
  }
  .popup-title{font-weight:700;font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .popup-row{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-muted);
    display:flex; justify-content:space-between; gap:12px;
  }
  .popup-row b{color:var(--text);font-weight:500;}
  .drone-icon{ filter:drop-shadow(0 0 3px rgba(0,0,0,0.6)); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">DRONE<span>ID</span></div>
  <div class="tabs">
    <button class="tab-btn active" id="tab-live">LIVE</button>
    <button class="tab-btn" id="tab-history">HISTORY</button>
    <button class="tab-btn" id="tab-settings">SETTINGS</button>
  </div>
  <div class="status"><span class="dot" id="conn-dot"></span><span id="conn-label">connecting…</span></div>
  <div class="health-group">
    <span class="health-item"><span class="dot" id="health-zmq-dot"></span>ZMQ</span>
    <span class="health-item"><span class="dot" id="health-bluetooth-dot"></span>Bluetooth</span>
    <span class="health-item"><span class="dot" id="health-wifi-dot"></span>WiFi</span>
  </div>
  <div class="count"><b id="track-count">0</b>&nbsp;<span id="count-label">tracked</span></div>
</div>

<div class="main">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-empty">No detections yet. Waiting for data from the DroneID decoder…</div>
  </div>
  <div class="map-wrap">
    <div id="map"></div>
    <div class="scrubber-bar" id="scrubber">
      <button class="scrub-btn" id="scrub-play">▶</button>
      <input type="range" class="scrub-range" id="scrub-range" min="0" max="0" value="0">
      <div class="scrub-readout" id="scrub-readout"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const map = L.map('map', { zoomControl: true, attributionControl: true }).setView([20, 0], 2);

// No API key required for either of these:
const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  subdomains: 'abc',
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
});
const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS community'
});
streetLayer.addTo(map);
L.control.layers({ 'Street': streetLayer, 'Satellite': satelliteLayer }, null, { position: 'topright' }).addTo(map);

const liveLayer = L.layerGroup().addTo(map);
const historyLayer = L.layerGroup();
const stationLayer = L.layerGroup().addTo(map);   // always visible, independent of live/history mode

let hasCentered = false;
let mode = 'live';               // 'live' | 'history'
const droneMarkers = new Map();  // key -> {marker, opMarker, link, pathLine, path, flightId, flightLoading, pairColor, data}
let selectedKey = null;
let selectedTarget = null; // 'drone' | 'operator' — which marker of the pair is focused
let suppressPopupClose = false; // true while we're closing a popup ourselves, so the
                                 // popupclose handler doesn't mistake it for the user hitting X
let stationCoord = null;         // { lat, lon } — server-side "home point", null until set in Settings
let stationMarker = null;

// Each tracked drone gets a persistent color, used for its operator marker,
// the dashed drone<->operator link, and a highlight ring on the drone icon
// when either half of the pair is selected — keeps the pairing visually
// obvious even with several drones/operators on screen at once.
const PAIR_COLORS = ['#4FD1C5', '#E8A33D', '#C77DFF', '#63B3ED', '#F6AD55', '#68D391', '#F687B3', '#90CDF4'];
let pairColorIndex = 0;
function nextPairColor() {
  const c = PAIR_COLORS[pairColorIndex % PAIR_COLORS.length];
  pairColorIndex++;
  return c;
}

// ---------------- shared helpers ----------------

function droneIconSvg(color, heading, haloColor) {
  const rot = (heading === null || heading === undefined) ? 0 : heading;
  const halo = haloColor ? `<circle cx="13" cy="13" r="11" fill="none" stroke="${haloColor}" stroke-width="2.5"/>` : '';
  return L.divIcon({
    className: 'drone-icon',
    html: `<svg width="26" height="26" viewBox="0 0 26 26" style="transform:rotate(${rot}deg)">
      ${halo}<polygon points="13,2 20,22 13,17 6,22" fill="${color}" stroke="#0B121A" stroke-width="1"/>
    </svg>`,
    iconSize: [26, 26], iconAnchor: [13, 13]
  });
}

function opIconSvg(color) {
  return L.divIcon({
    className: 'drone-icon',
    html: `<svg width="16" height="16" viewBox="0 0 16 16">
      <rect x="3" y="3" width="10" height="10" transform="rotate(45 8 8)" fill="none" stroke="${color}" stroke-width="2"/>
    </svg>`,
    iconSize: [16, 16], iconAnchor: [8, 8]
  });
}

function stationIconSvg() {
  return L.divIcon({
    className: 'drone-icon',
    html: `<svg width="22" height="22" viewBox="0 0 22 22">
      <circle cx="11" cy="11" r="9" fill="#1C2A38" stroke="#E6EDF3" stroke-width="2"/>
      <circle cx="11" cy="11" r="3" fill="#E6EDF3"/>
    </svg>`,
    iconSize: [22, 22], iconAnchor: [11, 11]
  });
}

// Haversine great-circle distance in meters — used for "distance to station".
function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = deg => deg * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function fmtDistance(meters) {
  if (meters < 1000) return `${meters.toFixed(0)} m`;
  return `${(meters / 1000).toFixed(2)} km`;
}

function placeStationMarker() {
  if (!stationCoord) {
    if (stationMarker) { stationLayer.removeLayer(stationMarker); stationMarker = null; }
    return;
  }
  const latlng = [stationCoord.lat, stationCoord.lon];
  if (!stationMarker) {
    stationMarker = L.marker(latlng, { icon: stationIconSvg() });
    stationMarker.bindTooltip('Station', { direction: 'top' });
    stationLayer.addLayer(stationMarker);
  } else {
    stationMarker.setLatLng(latlng);
  }
}

async function loadStation() {
  try {
    const res = await fetch('/api/station');
    const data = await res.json();
    if (data && data.lat !== null && data.lat !== undefined && data.lon !== null && data.lon !== undefined) {
      stationCoord = { lat: data.lat, lon: data.lon };
      placeStationMarker();
      // Station is the home point the map loads to — take priority over the
      // "auto-center on first drone seen" fallback.
      map.setView([data.lat, data.lon], 14);
      hasCentered = true;
    }
  } catch (e) { /* no station set yet, or fetch failed — fall back silently */ }
}

function statusColor(status) {
  if (status === 'live') return '#E8A33D';
  if (status === 'stale') return '#7C8B99';
  return '#E0645A';
}

function fmt(v, digits, suffix) {
  if (v === null || v === undefined) return '—';
  return v.toFixed(digits) + (suffix || '');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtDateTime(unixSeconds) {
  if (!unixSeconds) return '—';
  return new Date(unixSeconds * 1000).toLocaleString(undefined, { hour12: false });
}

function fmtDuration(startS, lastPointS) {
  // Duration reflects the actual span between first and last received data
  // point — not when the drop-detector eventually closed the flight, which
  // can lag well behind the last real packet.
  const end = lastPointS || startS;
  const secs = Math.max(0, Math.round(end - startS));
  const m = Math.floor(secs / 60), s = secs % 60;
  return `${m}m ${s}s`;
}

function fmtTrackedTime(totalSeconds) {
  // Seconds only until a minute is up, then Mm Ss, overflowing to Hh Mm
  // (dropping seconds) once it's been tracked an hour or more.
  const s = Math.max(0, Math.floor(totalSeconds));
  if (s < 60) return `${s}s`;
  const totalMinutes = Math.floor(s / 60);
  const secs = s % 60;
  if (totalMinutes < 60) return `${totalMinutes}m ${secs}s`;
  const hours = Math.floor(totalMinutes / 60);
  const mins = totalMinutes % 60;
  return `${hours}h ${mins}m`;
}

function fmtLastSeen(secondsSinceLastPoint) {
  // "live" for the first 5s after a packet, then counts up the same way as
  // Tracked Time — until either a new point resets it back to "live" or the
  // track times out and disappears entirely.
  if (secondsSinceLastPoint < 5) return 'live';
  return fmtTrackedTime(secondsSinceLastPoint);
}

// ---------------- field-toggle settings (Settings tab) ----------------
// Defines every metric the info box can show. Group names here are the
// display names used in both the Settings panel and the popups: "Basic"
// (Basic ID message + the live status indicator), "Drone" (Location/Vector
// Message — renders on the drone's own popup), "Operator" (System Message —
// renders on the operator marker's popup only).
const FIELD_DEFS = {
  'Basic': [
    { key: 'protocol_version', label: 'Protocol Version' },
    { key: 'serial',           label: 'Serial Number' },
    { key: 'ua_type',          label: 'UA Type' },
    { key: 'id',               label: 'ID' },
    { key: 'mac',              label: 'MAC' },
    { key: 'status',           label: 'Status' },
    { key: 'tracked_time',     label: 'Tracked Time', formatter: fmtTrackedTime },
    { key: 'last_seen_elapsed', label: 'Last Seen',   formatter: fmtLastSeen },
  ],
  'Drone': [
    { key: 'op_status',           label: 'Op Status' },
    { key: 'height_type',         label: 'Height Type' },
    { key: 'heading',             label: 'Direction',          digits: 0, unit: '°' },
    { key: 'speed',               label: 'Horiz Speed',        digits: 1, unit: ' m/s' },
    { key: 'vert_speed',          label: 'Vert Speed',         digits: 1, unit: ' m/s' },
    { key: 'lat',                 label: 'Latitude',           digits: 7, unit: '' },
    { key: 'lon',                 label: 'Longitude',          digits: 7, unit: '' },
    { key: 'pressure_altitude',   label: 'Pressure Altitude',  digits: 1, unit: ' m' },
    { key: 'alt',                 label: 'Geodetic Altitude',  digits: 1, unit: ' m' },
    { key: 'height_agl',          label: 'Height AGL',         digits: 1, unit: ' m' },
    { key: 'vertical_accuracy',   label: 'Vertical Accuracy' },
    { key: 'horizontal_accuracy', label: 'Horizontal Accuracy' },
    { key: 'baro_accuracy',       label: 'Baro Accuracy' },
    { key: 'speed_accuracy',      label: 'Speed Accuracy' },
    { key: 'loc_timestamp',       label: 'Timestamp' },
    { key: 'station_distance',    label: 'Distance to Station', formatter: fmtDistance },
  ],
  'Operator': [
    { key: 'op_location_type',       label: 'Op Location Type' },
    { key: 'op_classification_type', label: 'Op Classification Type' },
    { key: 'op_lat',                 label: 'Operator Latitude',  digits: 7, unit: '' },
    { key: 'op_lon',                 label: 'Operator Longitude', digits: 7, unit: '' },
    { key: 'op_station_distance',    label: 'Distance to Station', formatter: fmtDistance },
  ],
};

// Requested defaults: everything else in Basic/Drone starts OFF. Operator
// (System Message) defaults ON.
const FIELD_DEFAULTS = {
  'Basic': { protocol_version: false, serial: true, ua_type: false, id: true, mac: true, status: true, tracked_time: true, last_seen_elapsed: true },
  'Drone': {
    op_status: true, height_type: false, heading: true, speed: true, vert_speed: true,
    lat: true, lon: true, pressure_altitude: false, alt: false, height_agl: true,
    vertical_accuracy: false, horizontal_accuracy: false, baro_accuracy: false,
    speed_accuracy: false, loc_timestamp: false, station_distance: true,
  },
  'Operator': { op_location_type: true, op_classification_type: true, op_lat: true, op_lon: true, op_station_distance: true },
};

const FIELD_SETTINGS_KEY = 'droneid_field_toggles_v1';

function defaultFieldSettings() {
  const s = {};
  Object.keys(FIELD_DEFS).forEach(g => {
    s[g] = {};
    FIELD_DEFS[g].forEach(f => { s[g][f.key] = !!(FIELD_DEFAULTS[g] && FIELD_DEFAULTS[g][f.key]); });
  });
  return s;
}

function loadFieldSettings() {
  const defaults = defaultFieldSettings();
  try {
    const raw = localStorage.getItem(FIELD_SETTINGS_KEY);
    if (!raw) return defaults;
    const parsed = JSON.parse(raw);
    Object.keys(defaults).forEach(g => { Object.assign(defaults[g], parsed[g] || {}); });
  } catch (e) { /* corrupt/unavailable storage — fall back to defaults */ }
  return defaults;
}

function saveFieldSettings() {
  try { localStorage.setItem(FIELD_SETTINGS_KEY, JSON.stringify(fieldSettings)); } catch (e) { /* ignore */ }
}

let fieldSettings = loadFieldSettings();

function fieldValue(d, key) {
  if (key === 'id') return (d.serial !== null && d.serial !== undefined) ? d.serial : d.mac;
  if (key === 'tracked_time') {
    // Live: ticks up from when this track/flight started, relative to now.
    if (d.first_seen !== null && d.first_seen !== undefined) {
      return Math.max(0, (Date.now() / 1000) - d.first_seen);
    }
    // History playback: static elapsed time from flight start to the
    // currently-scrubbed point, not tied to wall-clock "now".
    if (d.started_at !== null && d.started_at !== undefined && d.point_ts !== null && d.point_ts !== undefined) {
      return Math.max(0, d.point_ts - d.started_at);
    }
    return null;
  }
  if (key === 'last_seen_elapsed') {
    // Live-only concept: time since the most recent data point for this
    // track. Not meaningful in history playback (every scrubbed point IS
    // "current" at that moment), so it naturally falls through to null there
    // since historyPointData() never sets last_seen.
    if (d.last_seen === null || d.last_seen === undefined) return null;
    return Math.max(0, (Date.now() / 1000) - d.last_seen);
  }
  if (key === 'station_distance') {
    if (!stationCoord || d.lat === null || d.lat === undefined || d.lon === null || d.lon === undefined) return null;
    return haversineMeters(stationCoord.lat, stationCoord.lon, d.lat, d.lon);
  }
  if (key === 'op_station_distance') {
    if (!stationCoord || d.op_lat === null || d.op_lat === undefined || d.op_lon === null || d.op_lon === undefined) return null;
    return haversineMeters(stationCoord.lat, stationCoord.lon, d.op_lat, d.op_lon);
  }
  return d[key];
}

function fieldDisplay(fdef, value) {
  if (value === null || value === undefined || value === '') return '—';
  if (fdef.formatter) return escapeHtml(fdef.formatter(value));
  if (fdef.digits !== undefined) {
    const n = Number(value);
    return Number.isFinite(n) ? fmt(n, fdef.digits, fdef.unit || '') : escapeHtml(String(value));
  }
  return escapeHtml(String(value));
}

// Renders the toggle-controlled field groups for the info box. `groups` is
// which message-type sections to include: the drone popup passes
// ['Basic', 'Drone'], the operator popup passes ['Operator'].
function renderInfoBox(d, groups) {
  let html = '';
  groups.forEach(g => {
    const settings = fieldSettings[g] || {};
    const defs = (FIELD_DEFS[g] || []).filter(f => settings[f.key]);
    if (!defs.length) return;
    html += `<div class="popup-group-title">${escapeHtml(g)}</div>`;
    html += defs.map(f => {
      const val = fieldValue(d, f.key);
      return `<div class="popup-row"><span>${escapeHtml(f.label)}</span><b>${fieldDisplay(f, val)}</b></div>`;
    }).join('');
  });
  return html;
}

function refreshOpenInfoBoxes() {
  if (mode === 'live' && selectedKey) {
    const entry = droneMarkers.get(selectedKey);
    if (entry) {
      if (entry.marker) entry.marker.setPopupContent(popupHtml(entry.data, entry.pairColor));
      if (entry.opMarker) entry.opMarker.setPopupContent(operatorPopupHtml(entry.data, entry.pairColor));
    }
  }
  if (mode === 'history' && historyState.marker) {
    const range = document.getElementById('scrub-range');
    const idx = range ? parseInt(range.value, 10) || 0 : 0;
    historyState.marker.setPopupContent(historyPopupHtml(idx));
  }
}

function renderSettingsPanel() {
  const sidebar = document.getElementById('sidebar');
  const stationHtml = `
    <div class="settings-group-title">Station</div>
    <div class="settings-note">
      Set this device's fixed reference location. It's stored on the server —
      the same for every browser/device that opens this app — and the map
      loads centered here every time.
    </div>
    <div class="station-form">
      <input id="station-lat" type="number" step="any" placeholder="Latitude"
             value="${stationCoord ? stationCoord.lat : ''}">
      <input id="station-lon" type="number" step="any" placeholder="Longitude"
             value="${stationCoord ? stationCoord.lon : ''}">
      <div class="station-form-buttons">
        <button id="station-save" class="settings-btn">Save</button>
        <button id="station-clear" class="settings-btn settings-btn-ghost">Clear</button>
      </div>
      <div class="settings-note" id="station-status">${stationCoord
        ? `Currently set: ${stationCoord.lat.toFixed(6)}, ${stationCoord.lon.toFixed(6)}`
        : 'Not set yet.'}</div>
    </div>`;

  let html = '<div class="settings-note" style="padding-top:12px;">Choose which fields appear in the info box shown when you click a drone on the map or scrub through its history. Applies everywhere — not per-drone.</div>';
  Object.keys(FIELD_DEFS).forEach(group => {
    html += `<div class="settings-group-title">${escapeHtml(group)}</div>`;
    html += FIELD_DEFS[group].map(f => {
      const checked = fieldSettings[group][f.key] ? 'checked' : '';
      return `
        <label class="settings-row">
          <input type="checkbox" data-group="${escapeHtml(group)}" data-key="${escapeHtml(f.key)}" ${checked}>
          <span>${escapeHtml(f.label)}</span>
        </label>`;
    }).join('');
  });
  html += stationHtml;
  sidebar.innerHTML = html;

  sidebar.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      fieldSettings[cb.dataset.group][cb.dataset.key] = cb.checked;
      saveFieldSettings();
      refreshOpenInfoBoxes();
    });
  });

  document.getElementById('station-save').addEventListener('click', async () => {
    const lat = parseFloat(document.getElementById('station-lat').value);
    const lon = parseFloat(document.getElementById('station-lon').value);
    const statusEl = document.getElementById('station-status');
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
      statusEl.textContent = 'Enter a valid latitude and longitude.';
      return;
    }
    try {
      const res = await fetch('/api/station', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lat, lon }),
      });
      const data = await res.json();
      if (!res.ok) {
        statusEl.textContent = data.error || 'Could not save station location.';
        return;
      }
      stationCoord = { lat, lon };
      placeStationMarker();
      map.setView([lat, lon], 14);
      refreshOpenInfoBoxes();
      renderSettingsPanel();
    } catch (e) {
      statusEl.textContent = 'Could not reach the server.';
    }
  });

  document.getElementById('station-clear').addEventListener('click', async () => {
    try {
      await fetch('/api/station', { method: 'DELETE' });
      stationCoord = null;
      placeStationMarker();
      refreshOpenInfoBoxes();
      renderSettingsPanel();
    } catch (e) { /* ignore */ }
  });
}

async function renameDrone(catalogKey, currentName) {
  const next = prompt('Name this drone (applies to all its flights, past and future):', currentName || '');
  if (next === null) return;
  const res = await fetch(`/api/drones/${encodeURIComponent(catalogKey)}/name`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nickname: next })
  });
  if (res.ok && mode === 'history') loadHistoryList();
}

// ---------------- LIVE mode ----------------

function upsertDrone(d) {
  const color = statusColor(d.status);
  let entry = droneMarkers.get(d.key);
  const hasPos = d.lat !== null && d.lat !== undefined && d.lon !== null && d.lon !== undefined;

  if (!entry) {
    entry = {
      marker: null, opMarker: null, link: null, pathLine: null, path: [],
      flightId: null, flightLoading: false, pairColor: nextPairColor(), data: d,
    };
    droneMarkers.set(d.key, entry);
  }
  entry.data = d;

  // backfill this flight's path once per flight_id (covers page load mid-flight)
  if (d.flight_id && entry.flightId !== d.flight_id && !entry.flightLoading) {
    entry.flightLoading = true;
    entry.flightId = d.flight_id;
    fetch(`/api/flights/${d.flight_id}`).then(r => r.json()).then(data => {
      entry.path = (data.points || [])
        .filter(p => p.lat !== null && p.lon !== null)
        .map(p => [p.lat, p.lon]);
      drawLivePath(entry, d.key);
      entry.flightLoading = false;
    }).catch(() => { entry.flightLoading = false; });
  }

  if (hasPos) {
    const latlng = [d.lat, d.lon];
    const last = entry.path[entry.path.length - 1];
    if (!last || last[0] !== d.lat || last[1] !== d.lon) {
      entry.path.push(latlng);
      drawLivePath(entry, d.key);
    }
    if (!entry.marker) {
      entry.marker = L.marker(latlng, { icon: droneIconSvg(color, d.heading) });
      entry.marker.on('click', () => selectTrack(d.key));
      // Leaflet's default autoClose would silently close this popup whenever
      // a different marker's popup opens, which fights with our own
      // drone<->operator swap logic — we manage closing explicitly instead.
      entry.marker.on('popupclose', () => {
        if (suppressPopupClose) return;
        if (selectedKey === d.key && selectedTarget === 'drone') {
          selectedKey = null;
          selectedTarget = null;
          droneMarkers.forEach((e, k) => { drawLivePath(e, k); updateDroneIcon(e, k); });
          renderSidebar();
        }
      });
      liveLayer.addLayer(entry.marker);
    } else {
      entry.marker.setLatLng(latlng);
    }
    updateDroneIcon(entry, d.key);
    entry.marker.bindPopup(popupHtml(d, entry.pairColor), { autoClose: false });
    if (selectedKey === d.key && selectedTarget === 'drone') entry.marker.openPopup();
    if (!hasCentered) { map.setView(latlng, 14); hasCentered = true; }
  }

  // Operator marker only appears once a valid (non 0,0) operator location has
  // been received — parse_latlon on the backend already nulls out 0,0.
  if (d.op_lat !== null && d.op_lat !== undefined && d.op_lon !== null && d.op_lon !== undefined) {
    const opLatlng = [d.op_lat, d.op_lon];
    if (!entry.opMarker) {
      entry.opMarker = L.marker(opLatlng, { icon: opIconSvg(entry.pairColor) });
      entry.opMarker.bindTooltip('Operator / ground station', { direction: 'top' });
      entry.opMarker.on('click', () => selectOperator(d.key));
      entry.opMarker.on('popupclose', () => {
        if (suppressPopupClose) return;
        if (selectedKey === d.key && selectedTarget === 'operator') {
          selectedKey = null;
          selectedTarget = null;
          droneMarkers.forEach((e, k) => { drawLivePath(e, k); updateDroneIcon(e, k); });
          renderSidebar();
        }
      });
      liveLayer.addLayer(entry.opMarker);
    } else {
      entry.opMarker.setLatLng(opLatlng);
      entry.opMarker.setIcon(opIconSvg(entry.pairColor));
    }
    entry.opMarker.bindPopup(operatorPopupHtml(d, entry.pairColor), { autoClose: false });
    if (selectedKey === d.key && selectedTarget === 'operator') entry.opMarker.openPopup();
    if (hasPos) {
      const linePts = [[d.lat, d.lon], opLatlng];
      if (!entry.link) {
        entry.link = L.polyline(linePts, { color: entry.pairColor, weight: 1, dashArray: '4,4', opacity: 0.6 });
        liveLayer.addLayer(entry.link);
      } else {
        entry.link.setLatLngs(linePts);
        entry.link.setStyle({ color: entry.pairColor });
      }
    }
  }

  if (mode === 'live') renderSidebar();
}

function updateDroneIcon(entry, key) {
  if (!entry.marker) return;
  const halo = (key === selectedKey) ? entry.pairColor : null;
  entry.marker.setIcon(droneIconSvg(statusColor(entry.data.status), entry.data.heading, halo));
}

function drawLivePath(entry, key) {
  if (entry.path.length < 2) return;
  const selected = key === selectedKey;
  const style = { color: '#E8A33D', weight: selected ? 3 : 2, opacity: selected ? 0.9 : 0.5 };
  if (!entry.pathLine) {
    entry.pathLine = L.polyline(entry.path, style);
    liveLayer.addLayer(entry.pathLine);
  } else {
    entry.pathLine.setLatLngs(entry.path);
    entry.pathLine.setStyle(style);
  }
}

function removeDrone(key) {
  const entry = droneMarkers.get(key);
  if (entry) {
    if (entry.marker) liveLayer.removeLayer(entry.marker);
    if (entry.opMarker) liveLayer.removeLayer(entry.opMarker);
    if (entry.link) liveLayer.removeLayer(entry.link);
    // leave the flight path visible but fade it to show it's no longer live
    if (entry.pathLine) entry.pathLine.setStyle({ color: '#7C8B99', opacity: 0.35, weight: 2 });
    droneMarkers.delete(key);
  }
  if (mode === 'live') renderSidebar();
}

function hexToRgba(hex, alpha) {
  const h = (hex || '#7C8B99').replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function popupBadgeHtml(label, color) {
  const bg = hexToRgba(color, 0.13);
  const border = hexToRgba(color, 0.45);
  return `<div class="popup-badge-row"><span class="popup-badge" style="background:${bg};color:${color};border-color:${border};">${escapeHtml(label)}</span></div>`;
}

function popupHtml(d, color) {
  const name = d.nickname || d.serial || d.mac;
  const warn = d.raw_units_warning
    ? `<div class="popup-row" style="color:#E8A33D"><span>⚠ alt/height/speed</span><b>unverified units</b></div>`
    : '';
  const extras = [
    d.registration_id ? `<div class="popup-row"><span>Registration</span><b>${escapeHtml(d.registration_id)}</b></div>` : '',
    d.operator_id ? `<div class="popup-row"><span>Operator ID</span><b>${escapeHtml(d.operator_id)}</b></div>` : '',
    d.description ? `<div class="popup-row"><span>Self ID</span><b>${escapeHtml(d.description)}</b></div>` : '',
  ].join('');
  return `
    ${popupBadgeHtml('AIRCRAFT', color || '#E8A33D')}
    <div class="popup-title">${escapeHtml(name)} <button class="pencil-btn" onclick="renameDrone('${escapeHtml(d.key)}','${escapeHtml(name)}')">✎</button></div>
    ${renderInfoBox(d, ['Basic', 'Drone'])}
    ${extras}
    ${warn}
  `;
}

function operatorPopupHtml(d, color) {
  const name = d.nickname || d.serial || d.mac;
  return `
    ${popupBadgeHtml('OPERATOR', color || '#4FD1C5')}
    <div class="popup-title">${escapeHtml(name)}</div>
    ${renderInfoBox(d, ['Basic', 'Operator'])}
  `;
}

function closeEntryPopups(entry) {
  if (!entry) return;
  suppressPopupClose = true;
  if (entry.marker && entry.marker.isPopupOpen()) entry.marker.closePopup();
  if (entry.opMarker && entry.opMarker.isPopupOpen()) entry.opMarker.closePopup();
  suppressPopupClose = false;
}

function selectTrack(key) {
  const prevEntry = selectedKey ? droneMarkers.get(selectedKey) : null;
  if (prevEntry && (selectedKey !== key || selectedTarget !== 'drone')) {
    closeEntryPopups(prevEntry);
  }
  selectedKey = key;
  selectedTarget = 'drone';
  const entry = droneMarkers.get(key);
  if (entry) {
    if (entry.marker) { map.panTo(entry.marker.getLatLng()); entry.marker.openPopup(); }
    drawLivePath(entry, key);
  }
  // dim every other track's path so the selected drone's route stands out,
  // and refresh every drone icon's halo ring (only the selected one keeps it)
  droneMarkers.forEach((e, k) => { drawLivePath(e, k); updateDroneIcon(e, k); });
  renderSidebar();
}

function selectOperator(key) {
  const prevEntry = selectedKey ? droneMarkers.get(selectedKey) : null;
  if (prevEntry && (selectedKey !== key || selectedTarget !== 'operator')) {
    closeEntryPopups(prevEntry);
  }
  selectedKey = key;
  selectedTarget = 'operator';
  const entry = droneMarkers.get(key);
  if (entry) {
    if (entry.opMarker) entry.opMarker.openPopup();
    if (entry.marker && entry.opMarker) {
      map.fitBounds(L.latLngBounds([entry.marker.getLatLng(), entry.opMarker.getLatLng()]), { padding: [60, 60] });
    } else if (entry.opMarker) {
      map.panTo(entry.opMarker.getLatLng());
    }
    drawLivePath(entry, key);
  }
  droneMarkers.forEach((e, k) => { drawLivePath(e, k); updateDroneIcon(e, k); });
  renderSidebar();
}

function renderLiveSidebar() {
  const sidebar = document.getElementById('sidebar');
  const entries = Array.from(droneMarkers.values()).sort((a, b) => (b.data.last_seen || 0) - (a.data.last_seen || 0));
  document.getElementById('track-count').textContent = entries.length;
  document.getElementById('count-label').textContent = 'tracked';

  if (entries.length === 0) {
    sidebar.innerHTML = '<div class="sidebar-empty">No detections yet. Waiting for data from the DroneID decoder…</div>';
    return;
  }

  sidebar.innerHTML = entries.map(({ data: d }) => {
    const name = d.nickname || d.serial || d.mac;
    const sel = d.key === selectedKey ? ' selected' : '';
    const hasOp = d.op_lat !== null && d.op_lat !== undefined && d.op_lon !== null && d.op_lon !== undefined;
    return `
      <div class="track-row${sel}" data-key="${escapeHtml(d.key)}">
        <div class="row-top">
          <span class="status-chip ${d.status}"></span>
          <span class="track-name">${escapeHtml(name)}</span>
          <button class="pencil-btn" data-rename="${escapeHtml(d.key)}" data-name="${escapeHtml(name)}">✎</button>
        </div>
        <div class="track-sub">
          <span>${escapeHtml(d.mac || '—')}</span>
          <span>${fmt(d.alt,0,'m')}</span>
          <span>${fmt(d.heading,0,'°')}</span>
        </div>
        <div class="track-op-row">
          <span class="track-op-indicator${hasOp ? ' op-yes' : ''}">
            <span class="op-dot${hasOp ? ' op-yes' : ''}"></span>${hasOp ? 'Operator Detected' : 'No Operator Detected'}
          </span>
          ${hasOp ? `<button class="focus-op-btn" data-focus-op="${escapeHtml(d.key)}">Focus Op</button>` : ''}
        </div>
      </div>`;
  }).join('');

  sidebar.querySelectorAll('.track-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.dataset.rename || e.target.dataset.focusOp) return; // buttons handle their own clicks below
      selectTrack(row.dataset.key);
    });
  });
  sidebar.querySelectorAll('[data-rename]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      renameDrone(btn.dataset.rename, btn.dataset.name);
    });
  });
  sidebar.querySelectorAll('[data-focus-op]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      selectOperator(btn.dataset.focusOp);
    });
  });
}

// ---------------- HISTORY mode ----------------

let historyState = { flightId: null, flightMeta: null, points: [], marker: null, line: null, playing: false, timer: null };

function historyPointData(idx) {
  const p = historyState.points[idx] || {};
  const f = historyState.flightMeta || {};
  return {
    mac: f.mac, serial: f.serial, ua_type: f.ua_type,
    protocol_version: p.protocol_version || f.protocol_version,
    registration_id: f.registration_id,
    // no live "status" or ticking "tracked_time" in playback — instead,
    // tracked_time here shows elapsed time from flight start to this
    // scrubbed point (started_at/point_ts below), computed statically.
    started_at: f.started_at, point_ts: p.ts,
    op_status: p.op_status, height_type: p.height_type,
    heading: p.heading, speed: p.speed, vert_speed: p.vert_speed,
    lat: p.lat, lon: p.lon,
    pressure_altitude: p.pressure_altitude, alt: p.alt, height_agl: p.height_agl,
    vertical_accuracy: p.vertical_accuracy, horizontal_accuracy: p.horizontal_accuracy,
    baro_accuracy: p.baro_accuracy, speed_accuracy: p.speed_accuracy,
    loc_timestamp: p.loc_timestamp,
    op_location_type: p.op_location_type, op_classification_type: p.op_classification_type,
    op_lat: p.op_lat, op_lon: p.op_lon,
  };
}

function historyPopupHtml(idx) {
  const d = historyPointData(idx);
  const name = historyState.flightMeta ? historyState.flightMeta.display_name : '';
  return `
    ${popupBadgeHtml('AIRCRAFT', '#4FD1C5')}
    <div class="popup-title">${escapeHtml(name)}</div>
    ${renderInfoBox(d, ['Basic', 'Drone'])}
  `;
}

async function loadHistoryList() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '<div class="sidebar-empty">Loading flights…</div>';
  const res = await fetch('/api/flights?limit=100');
  const data = await res.json();
  const flights = data.flights || [];
  document.getElementById('track-count').textContent = flights.length;
  document.getElementById('count-label').textContent = 'flights';

  if (flights.length === 0) {
    sidebar.innerHTML = '<div class="sidebar-empty">No recorded flights yet.</div>';
    return;
  }

  sidebar.innerHTML = flights.map(f => {
    const sel = f.id === historyState.flightId ? ' selected' : '';
    const inProgress = !f.ended_at;
    return `
      <div class="track-row${sel}" data-flight="${f.id}" data-key="${escapeHtml(f.catalog_key)}" data-name="${escapeHtml(f.display_name)}">
        <div class="row-top">
          <span class="status-chip ${inProgress ? 'live' : ''}" style="${inProgress ? '' : 'background:#3A4A5A'}"></span>
          <span class="track-name">${escapeHtml(f.display_name)}</span>
          <button class="pencil-btn" data-rename="${escapeHtml(f.catalog_key)}" data-name="${escapeHtml(f.display_name)}">✎</button>
        </div>
        <div class="track-sub">
          <span class="track-date">${fmtDateTime(f.started_at)}</span>
        </div>
        <div class="track-sub">
          <span>${fmtDuration(f.started_at, f.last_point_at)}</span>
          <span>${f.point_count} pts</span>
          ${inProgress ? '<span style="color:#E8A33D">in progress</span>' : ''}
        </div>
      </div>`;
  }).join('');

  sidebar.querySelectorAll('.track-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.dataset.rename) return;
      selectHistoryFlight(parseInt(row.dataset.flight, 10));
    });
  });
  sidebar.querySelectorAll('[data-rename]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      renameDrone(btn.dataset.rename, btn.dataset.name);
    });
  });
}

async function selectHistoryFlight(flightId) {
  stopPlayback();
  historyLayer.clearLayers();
  const res = await fetch(`/api/flights/${flightId}`);
  const data = await res.json();
  const points = (data.points || []).filter(p => p.lat !== null && p.lon !== null);
  historyState = { flightId, flightMeta: data.flight || null, points, marker: null, line: null, playing: false, timer: null };

  const scrubber = document.getElementById('scrubber');
  const range = document.getElementById('scrub-range');

  if (points.length === 0) {
    document.getElementById('scrub-readout').textContent = 'No position data recorded for this flight.';
    scrubber.classList.add('show');
    range.max = 0;
    return;
  }

  const latlngs = points.map(p => [p.lat, p.lon]);
  historyState.line = L.polyline(latlngs, { color: '#4FD1C5', weight: 3, opacity: 0.8 });
  historyLayer.addLayer(historyState.line);
  historyState.marker = L.marker(latlngs[0], { icon: droneIconSvg('#4FD1C5', points[0].heading) });
  historyState.marker.bindPopup(historyPopupHtml(0));
  historyLayer.addLayer(historyState.marker);
  map.fitBounds(historyState.line.getBounds(), { padding: [40, 40] });

  range.max = points.length - 1;
  range.value = 0;
  scrubber.classList.add('show');
  scrubToIndex(0);
  historyState.marker.openPopup();
  loadHistoryList(); // refresh selection highlight
}

function scrubToIndex(idx) {
  const p = historyState.points[idx];
  if (!p) return;
  historyState.marker.setLatLng([p.lat, p.lon]);
  historyState.marker.setIcon(droneIconSvg('#4FD1C5', p.heading));
  historyState.marker.setPopupContent(historyPopupHtml(idx));
  document.getElementById('scrub-readout').innerHTML = `
    <span>${fmtDateTime(p.ts)}</span>
    <span>alt <b>${fmt(p.alt,1,'m')}</b></span>
    <span>hdg <b>${fmt(p.heading,0,'°')}</b></span>
    <span>spd <b>${fmt(p.speed,1,'m/s')}</b></span>
  `;
}

function stopPlayback() {
  historyState.playing = false;
  if (historyState.timer) clearInterval(historyState.timer);
  document.getElementById('scrub-play').textContent = '▶';
}

function togglePlayback() {
  if (!historyState.points.length) return;
  if (historyState.playing) { stopPlayback(); return; }
  historyState.playing = true;
  document.getElementById('scrub-play').textContent = '⏸';
  const range = document.getElementById('scrub-range');
  historyState.timer = setInterval(() => {
    let idx = parseInt(range.value, 10) + 1;
    if (idx >= historyState.points.length) { stopPlayback(); return; }
    range.value = idx;
    scrubToIndex(idx);
  }, 150);
}

document.getElementById('scrub-range').addEventListener('input', (e) => {
  scrubToIndex(parseInt(e.target.value, 10));
});
document.getElementById('scrub-play').addEventListener('click', togglePlayback);

// ---------------- mode switching ----------------

let sidebarCollapsed = false;

function setSidebarCollapsed(collapsed) {
  sidebarCollapsed = collapsed;
  document.getElementById('sidebar').classList.toggle('collapsed', collapsed);
  // Leaflet doesn't notice its container resizing on its own; nudge it once
  // the width transition (200ms) has finished so tiles/markers reflow.
  setTimeout(() => map.invalidateSize(), 220);
}

function renderSidebar() {
  if (mode === 'live') renderLiveSidebar();
  else if (mode === 'history') loadHistoryList();
  // 'settings' mode renders its own panel via renderSettingsPanel() and is
  // untouched by live/history data updates.
}

function switchMode(next) {
  if (mode === next) {
    // tapping/clicking the already-open tab collapses (or reopens) the panel
    setSidebarCollapsed(!sidebarCollapsed);
    return;
  }
  mode = next;
  if (sidebarCollapsed) setSidebarCollapsed(false);
  document.getElementById('tab-live').classList.toggle('active', next === 'live');
  document.getElementById('tab-history').classList.toggle('active', next === 'history');
  document.getElementById('tab-settings').classList.toggle('active', next === 'settings');
  document.getElementById('scrubber').classList.toggle('show', next === 'history' && historyState.points.length > 0);

  if (next === 'live') {
    map.removeLayer(historyLayer);
    map.addLayer(liveLayer);
    stopPlayback();
    renderLiveSidebar();
  } else if (next === 'history') {
    map.removeLayer(liveLayer);
    map.addLayer(historyLayer);
    loadHistoryList();
  } else if (next === 'settings') {
    stopPlayback();
    document.getElementById('track-count').textContent = '';
    document.getElementById('count-label').textContent = 'settings';
    renderSettingsPanel();
  }
}

document.getElementById('tab-live').addEventListener('click', () => switchMode('live'));
document.getElementById('tab-history').addEventListener('click', () => switchMode('history'));
document.getElementById('tab-settings').addEventListener('click', () => switchMode('settings'));

// ---------------- websocket ----------------

function setConnState(connected, label) {
  document.getElementById('conn-dot').classList.toggle('connected', connected);
  document.getElementById('conn-label').textContent = label;
}

function applyHealth(health) {
  ['zmq', 'bluetooth', 'wifi'].forEach(ch => {
    const dot = document.getElementById(`health-${ch}-dot`);
    if (!dot) return;
    const state = (health && health[ch]) || 'red';
    dot.classList.toggle('health-ok', state === 'green');
    dot.classList.toggle('health-yellow', state === 'yellow');
  });
}

function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => setConnState(true, 'live');
  ws.onclose = () => {
    setConnState(false, 'reconnecting…');
    applyHealth({}); // unknown until we reconnect and hear otherwise
    setTimeout(connectWs, 2000);
  };
  ws.onerror = () => ws.close();

  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.type === 'snapshot') {
      msg.drones.forEach(upsertDrone);
      applyHealth(msg.health);
    } else if (msg.type === 'update') {
      upsertDrone(msg.drone);
    } else if (msg.type === 'status') {
      const entry = droneMarkers.get(msg.key);
      if (entry) { entry.data.status = msg.status; upsertDrone(entry.data); }
    } else if (msg.type === 'dropped') {
      removeDrone(msg.key);
    } else if (msg.type === 'health') {
      applyHealth(msg.health);
    }
  };
}

connectWs();
loadStation();

// Ticks any currently-open popup once a second so "Tracked Time" counts up
// live even between bursts, without waiting on new data to arrive.
setInterval(() => {
  if (mode === 'live' && selectedKey) refreshOpenInfoBoxes();
}, 1000);
</script>
